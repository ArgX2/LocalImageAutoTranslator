<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Local Image Translator</title>
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }
    h3 { margin-top: 0; color: #333; }
    p { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 10px; }
    .highlight { color: #d93025; font-weight: bold; }
    button {
      padding: 10px;
      width: 100%;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      color: white;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    #openTranslateBtn { background-color: #4285f4; }
    #openTranslateBtn:hover { background-color: #3367d6; }
    #helpBtn { background-color: #fbbc04; color: #333; margin-top: 8px; }
    #helpBtn:hover { background-color: #e0a800; }

    #helpContent {
      display: none;
      text-align: left;
      font-size: 12px;
      background: #f8f9fa;
      border: 1px solid #dadce0;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
      color: #3c4043;
    }
    #helpContent ol { padding-left: 20px; margin: 0; }
    #helpContent li { margin-bottom: 6px; }

    .lang-selector-popup {
      margin-top: 15px;
      border-top: 1px solid #eee;
      padding-top: 10px;
      text-align: right;
    }
    .lang-selector-popup label { font-size: 12px; }
  </style>
</head>
<body>
  <h3 id="popup-title">이미지 자동 번역기</h3>
  <p id="popup-p1">이 확장 프로그램은 구글 번역 페이지 자체에 내장된 컨트롤러를 사용합니다.</p>
  <p id="popup-p2">아래 버튼을 눌러 페이지를 열고, <br><span class="highlight">화면 우측 하단의 컨트롤러</span>를 사용해 주세요.</p>

  <button id="openTranslateBtn">구글 이미지 번역 열기</button>
  <button id="helpBtn">도움말</button>

  <div id="helpContent">
    <ol>
      <li id="help-li-1"></li>
      <li id="help-li-2"></li>
      <li id="help-li-3"></li>
      <li id="help-li-4"></li>
    </ol>
  </div>

  <div class="lang-selector-popup">
    <label for="popup-ui-lang" id="popup-ui-lang-label">UI 언어:</label>
    <select id="popup-ui-lang" style="padding: 2px; border-radius: 3px; font-size: 11px;">
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>
  </div>

  <script src="popup.js"></script>
</body>
</html>
